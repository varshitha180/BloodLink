<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Blood - BloodLink</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <div class="logo">
            🩸 Blood<span>Link</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="find-blood.html">Find Blood</a>
            <a href="hospital.html">Dashboard</a>
            <a href="profile.html">Profile</a>
        </nav>

        <div class="nav-buttons">
            <a href="login.html" class="login-btn">Logout</a>
        </div>

    </header>


    <!-- Request Blood Section -->
    <section class="auth-section">

        <div class="auth-container">

            <h1>Request Blood</h1>

            <p>
                Submit a blood request for a patient who needs blood support.
            </p>


            <form>

                <!-- Patient Name -->
                <div class="form-group">

                    <label for="patientName">
                        Patient Name
                    </label>

                    <input
                        type="text"
                        id="patientName"
                        placeholder="Enter patient name"
                        required
                    >

                </div>


                <!-- Blood Group -->
                <div class="form-group">

                    <label for="bloodGroup">
                        Required Blood Group
                    </label>

                    <select id="bloodGroup" required>

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>


                <!-- Units -->
                <div class="form-group">

                    <label for="units">
                        Required Units
                    </label>

                    <input
                        type="number"
                        id="units"
                        min="1"
                        placeholder="Enter number of units"
                        required
                    >

                </div>


                <!-- Urgency -->
                <div class="form-group">

                    <label for="urgency">
                        Urgency
                    </label>

                    <select id="urgency" required>

                        <option value="">
                            Select Urgency
                        </option>

                        <option value="Normal">
                            Normal
                        </option>

                        <option value="Urgent">
                            Urgent
                        </option>

                        <option value="Emergency">
                            Emergency
                        </option>

                    </select>

                </div>


                <!-- Hospital -->
                <div class="form-group">

                    <label for="hospital">
                        Hospital Name
                    </label>

                    <input
                        type="text"
                        id="hospital"
                        value="City Care Hospital"
                        required
                    >

                </div>


                <!-- Location -->
                <div class="form-group">

                    <label for="location">
                        Hospital Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Enter hospital location"
                        required
                    >

                </div>


                <!-- Contact -->
                <div class="form-group">

                    <label for="contact">
                        Contact Number
                    </label>

                    <input
                        type="tel"
                        id="contact"
                        placeholder="Enter contact number"
                        required
                    >

                </div>


                <!-- Additional Information -->
                <div class="form-group">

                    <label for="message">
                        Additional Information
                    </label>

                    <textarea
                        id="message"
                        rows="4"
                        placeholder="Enter any additional information"
                    ></textarea>

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="auth-button">
                    🩸 Submit Blood Request
                </button>

            </form>


            <!-- Back -->
            <div class="auth-footer">

                <p>
                    <a href="hospital.html">
                        ← Back to Hospital Dashboard
                    </a>
                </p>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 BloodLink. Donate Blood. Save Lives.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
